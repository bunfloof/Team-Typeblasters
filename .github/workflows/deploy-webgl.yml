# Build an artifact; publish playable versions manually to gh-pages.
# Keep each release in its own folder on gh-pages so older links remain playable.
name: Build WebGL for manual gh-pages publishing

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webgl-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the WebGL player
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Free up disk space on the runner
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Cache the Library folder
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build the WebGL player
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Upload WebGL build for manual publishing
        uses: actions/upload-artifact@v5
        with:
          name: WebGL-${{ github.sha }}
          path: build/WebGL/WebGL
          if-no-files-found: error
          retention-days: 90
